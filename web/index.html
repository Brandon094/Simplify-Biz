<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP+ Business | Plataforma de Gestión Comercial POS & Inventario Offline</title>
  <meta name="description" content="Software de escritorio de alto rendimiento para PyMEs: Punto de Venta POS, Inventario con Kardex, Cartera CxC, Compras y Analítica en SQLite transaccional.">
  <meta name="keywords" content="ERP, Punto de Venta, POS, Inventario, Gestión Comercial, Software Negocios, Cierre Z, Cartera, Colombia">
  
  <!-- TailwindCSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0B0F19',
              card: '#111827',
              blue: '#3B82F6',
              purple: '#A855F7',
              green: '#22C55E',
              amber: '#F59E0B',
              cyan: '#06B6D4'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/app_icon.png">
</head>
<body class="bg-[#0B0F19] text-slate-100 font-sans antialiased selection:bg-purple-500 selection:text-white overflow-x-hidden">

  <!-- Ambient Glowing Background Orbs -->
  <div class="fixed -top-24 -right-24 w-96 h-96 bg-purple-600/25 rounded-full blur-[120px] pointer-events-none z-0"></div>
  <div class="fixed top-96 -left-24 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
  <div class="fixed bottom-48 right-10 w-80 h-80 bg-emerald-500/15 rounded-full blur-[120px] pointer-events-none z-0"></div>

  <!-- ATOMIC DESIGN COMPONENT INCLUSIONS (DRY & DESACOPLADO) -->
  
  <!-- Organism 1: Navbar Header -->
  <div data-include="components/organisms/navbar.html"></div>

  <!-- Organism 2: Hero Section & Interactive Mockup -->
  <div data-include="components/organisms/hero.html"></div>

  <!-- Organism 3: Core Modules Grid -->
  <div data-include="components/organisms/modules.html"></div>

  <!-- Organism 4: MVVM Reactive ROI Calculator -->
  <div data-include="components/organisms/calculator.html"></div>

  <!-- Organism 5: Native OS Downloads -->
  <div data-include="components/organisms/downloads.html"></div>

  <!-- Organism 6: Footer -->
  <div data-include="components/organisms/footer.html"></div>

  <!-- JS Scripts (MVVM ViewModels & Atomic Component Loader) -->
  <script src="js/app-viewmodel.js"></script>
  <script src="js/component-loader.js"></script>
</body>
</html>
