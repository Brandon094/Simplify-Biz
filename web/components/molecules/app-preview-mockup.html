<!-- MOLECULES: Desktop Mockup Frame Component (UI Real de PC) -->
<div id="demostracion" class="w-full max-w-5xl bg-slate-900 border border-white/20 rounded-2xl overflow-hidden shadow-2xl shadow-purple-950/60 text-left relative">
  <!-- PC Monitor Header Bar -->
  <div class="bg-slate-800/90 px-4 py-3 flex items-center justify-between border-b border-white/10">
    <div class="flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-rose-500"></div>
        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
        <span class="text-xs text-slate-300 ml-2 font-mono font-semibold">ERP+ Business — Programa de Escritorio para PC</span>
      </div>
      <span class="px-3 py-1 text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded-full flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
        Abastecimiento
      </span>
    </div>
    <div class="text-[11px] font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20 hidden sm:block">
      ✓ Funcionando Localmente (Modo Seguro)
    </div>
  </div>

  <!-- Real Screenshot Container -->
  <div class="p-3 sm:p-5 bg-[#0F172A] relative flex items-center justify-center">
    <img 
      src="assets/images/preview-dashboard-pc.png" 
      alt="Interfaz Real de ERP+ Business en Computador" 
      class="w-full h-auto rounded-lg shadow-xl border border-white/10 object-cover"
      onerror="this.onerror=null; this.src='assets/images/app_icon.png'; this.className='w-32 h-32 my-12 opacity-80 animate-pulse';"
    >
  </div>

  <!-- Floating Badge Indicator -->
  <div class="bg-slate-950/90 border-t border-white/10 px-4 py-2.5 text-center text-xs text-slate-300 flex items-center justify-center gap-2">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
    <span class="font-semibold text-slate-200">Interfaz real de ERP+ Business en funcionamiento en su computador.</span>
  </div>
</div>
