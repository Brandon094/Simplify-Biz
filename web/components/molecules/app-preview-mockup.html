<!-- MOLECULES: Desktop Mockup Frame Component (UI Real de PC - Mobile Optimized) -->
<div id="demostracion" class="w-full max-w-5xl bg-slate-900 border border-white/20 rounded-2xl overflow-hidden shadow-2xl shadow-purple-950/60 text-left relative">
  <!-- PC Monitor Header Bar -->
  <div class="bg-slate-800/90 px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between border-b border-white/10 flex-wrap gap-2">
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-1.5 sm:gap-2">
        <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-rose-500"></div>
        <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-amber-500"></div>
        <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-emerald-500"></div>
        <span class="text-[10px] sm:text-xs text-slate-300 ml-1 sm:ml-2 font-mono font-semibold">ERP+ v2.1.0</span>
      </div>
    </div>

    <!-- Navigation Tabs for All Main Modules (Horizontal Scrollable on Mobile) -->
    <div class="flex items-center gap-1.5 overflow-x-auto text-[11px] sm:text-xs py-1 scrollbar-none max-w-full touch-pan-x">
      <button class="preview-tab active px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-purple-600/30 text-purple-300 border border-purple-500/40 font-semibold transition-all whitespace-nowrap">
        Dashboard
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        POS
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        Inventario
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        Abastecimiento
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        Cartera
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        Clientes
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        Empleados
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        Reportes
      </button>
      <button class="preview-tab px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-white/5 font-medium transition-all whitespace-nowrap">
        Configurar
      </button>
    </div>

    <div class="text-[11px] font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20 hidden xl:block">
      ✓ Base de Datos Local SQLite
    </div>
  </div>

  <!-- Real Screenshot Display Container (Full view with no cropping) -->
  <div class="p-1.5 sm:p-4 bg-[#0B0F19] relative flex items-center justify-center min-h-[220px] xs:min-h-[280px] sm:min-h-[480px]">
    <img 
      id="main-preview-img"
      src="assets/images/dashboard.png" 
      alt="Interfaz Real de ERP+ Business en Computador" 
      class="w-full h-auto max-h-[350px] sm:max-h-[600px] rounded-xl shadow-2xl border border-white/10 object-contain transition-opacity duration-300 pointer-events-none select-none"
    >
    
    <!-- Mobile Touch Hint Overlay -->
    <div class="absolute bottom-3 right-3 sm:hidden bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/10 text-[10px] text-purple-300 font-medium flex items-center gap-1 pointer-events-none">
      <span>👈 Desliza para cambiar 👉</span>
    </div>
  </div>

  <!-- Floating Badge Indicator -->
  <div class="bg-slate-950/90 border-t border-white/10 px-3 sm:px-4 py-2 sm:py-2.5 text-center text-[11px] sm:text-xs text-slate-300 flex items-center justify-center gap-2">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping shrink-0"></span>
    <span id="preview-caption" class="font-semibold text-slate-200 line-clamp-1">Panel Principal (Dashboard BI) — Captura real completa de la aplicación en PC</span>
  </div>
</div>

<script>
  window.changePreviewImage = function(btnElement, src, caption) {
    const img = document.getElementById('main-preview-img');
    const cap = document.getElementById('preview-caption');
    if (!img) return;
    img.style.opacity = '0.3';
    setTimeout(() => {
      img.src = src;
      if (cap) cap.textContent = caption + ' — Captura real completa de la aplicación en PC';
      img.style.opacity = '1';
    }, 150);

    // Update active tab styles
    document.querySelectorAll('.preview-tab').forEach(btn => {
      btn.classList.remove('bg-purple-600/30', 'text-purple-300', 'border-purple-500/40', 'font-semibold');
      btn.classList.add('bg-slate-800', 'text-slate-400', 'border-white/5', 'font-medium');
    });
    if (btnElement) {
      btnElement.classList.remove('bg-slate-800', 'text-slate-400', 'border-white/5', 'font-medium');
      btnElement.classList.add('bg-purple-600/30', 'text-purple-300', 'border-purple-500/40', 'font-semibold');
    }
  };
</script>
